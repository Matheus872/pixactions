[project]
name = "pixactions-api"
version = "0.1.0"
description = "Pix Actions API: pay with Pix, receive onchain on Solana"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "solders>=0.23",
  "solana>=0.36",
  "pyjwt[crypto]>=2.9",
  "qrcode[pil]>=7.4",
  "scalar-fastapi>=1.0",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiosqlite>=0.20", "ruff>=0.6"]

[tool.vercel]
entrypoint = "pixactions_api.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
